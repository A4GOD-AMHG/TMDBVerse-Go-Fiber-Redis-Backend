basePath: /
definitions:
  models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  models.Genre:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.Movie:
    properties:
      backdrop_path:
        type: string
      genres:
        items:
          $ref: '#/definitions/models.Genre'
        type: array
      id:
        type: integer
      original_language:
        type: string
      original_title:
        type: string
      overview:
        type: string
      poster_path:
        type: string
      release_date:
        type: string
      runtime:
        type: integer
      search_count:
        type: integer
      title:
        type: string
      vote_average:
        type: number
    type: object
host: localhost:8080
info:
  contact: {}
  description: API proxy for The Movie DB with Redis caching
  title: TMDBVerse-Go-Fiber-Redis-Backend
  version: 1.1.0
paths:
  /discover:
    get:
      description: Get movies from discover endpoint sorted by popularity
      parameters:
      - description: Page number (1-500)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Movie'
            type: array
        "400":
          description: Invalid page
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "502":
          description: TMDB error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get discover movies
      tags:
      - movies
  /movies/{id}:
    get:
      description: Get complete details for a specific movie
      parameters:
      - description: Movie ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Movie'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Movie not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "502":
          description: TMDB error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get movie details
      tags:
      - movies
  /popular:
    get:
      description: Get the 3 most popular movies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Movie'
            type: array
        "502":
          description: TMDB error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get top popular movies
      tags:
      - movies
  /search:
    get:
      description: Search movies by title
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Page number (1-500)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Movie'
            type: array
        "400":
          description: Missing query or invalid page
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "502":
          description: TMDB error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Search movies
      tags:
      - movies
  /trending:
    get:
      description: Get top 5 trending movies based on searches
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Movie'
            type: array
        "500":
          description: Redis error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get trending movies
      tags:
      - movies
swagger: "2.0"
