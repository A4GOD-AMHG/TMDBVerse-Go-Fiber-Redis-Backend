services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  tmdbverse-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TMDB_API_ACCESS_TOKEN=${TMDB_API_ACCESS_TOKEN}
      # Inside the compose network Redis is reachable by its service name.
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

volumes:
  redis_data:
